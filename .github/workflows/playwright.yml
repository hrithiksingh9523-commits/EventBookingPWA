name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Start app server in background and wait
      run: |
        npm run start --silent &
        npx wait-on http://localhost:3000
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Chromium & WebKit (parallel)
      run: npx playwright test --project=chromium --project=webkit --reporter=list

    - name: Upload artifacts (Chromium+WebKit)
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-artifacts-chromium-webkit
        path: |
          playwright-report/
          test-results/
          videos/
          screenshots/

    - name: Run Firefox (serial)
      run: npx playwright test --project=firefox --workers=1 --timeout=120000 --reporter=list

    - name: Upload artifacts (Firefox)
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-artifacts-firefox
        path: |
          playwright-report/
          test-results/
          videos/
          screenshots/
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
