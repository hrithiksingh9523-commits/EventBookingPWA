name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://eventhub.rahulshettyacademy.com
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Chromium tests
      run: npx playwright test --project=chromium --reporter=list,json,html
      env:
        PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/chromium.json
      continue-on-error: true

    - name: Run WebKit tests
      run: npx playwright test --project=webkit --reporter=list,json,html
      env:
        PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/webkit.json
      continue-on-error: true

    - name: Run Firefox tests
      run: npx playwright test --project=firefox --workers=1 --timeout=120000 --reporter=list,json,html
      env:
        PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/firefox.json
      continue-on-error: true

    - name: Generate test dashboard
      if: always()
      run: node scripts/create-test-summary.mjs

    - name: Upload Playwright artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-artifacts
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore
        retention-days: 30
